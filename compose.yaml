name: facilit-kanban

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kanban}
      DB_USERNAME: ${POSTGRES_USER:-kanban}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      GRAPHQL_GRAPHIQL_ENABLED: "true"
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:?APP_ADMIN_EMAIL is required}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD is required}
      APP_DEMO_RESPONSIBLE_NAME: ${APP_DEMO_RESPONSIBLE_NAME:-}
      APP_DEMO_RESPONSIBLE_EMAIL: ${APP_DEMO_RESPONSIBLE_EMAIL:-}
      APP_DEMO_RESPONSIBLE_POSITION: ${APP_DEMO_RESPONSIBLE_POSITION:-}
      APP_DEMO_RESPONSIBLE_PASSWORD: ${APP_DEMO_RESPONSIBLE_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      APP_METRICS_PASSWORD: ${METRICS_PASSWORD:-}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
