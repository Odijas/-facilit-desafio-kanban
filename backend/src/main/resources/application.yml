spring:
  application:
    name: facilit-kanban
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kanban}
    username: ${DB_USERNAME:kanban}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  web:
    # Mensagens da API (inclusive as de Bean Validation) em pt-BR, independentemente do Accept-Language.
    locale: pt_BR
    locale-resolver: fixed
  graphql:
    graphiql:
      enabled: ${GRAPHQL_GRAPHIQL_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  # As respostas de erro são documentadas por ApiErrorDocumentation, operação a operação.
  override-with-generic-response: false
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

app:
  # Fuso de negócio: define o "hoje" das regras de status, atraso e % de tempo restante.
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  schedule-refresh:
    # Recálculo diário (segundo minuto hora dia mês dia-da-semana), no fuso acima.
    cron: "${APP_SCHEDULE_REFRESH_CRON:0 0 0 * * *}"
  metrics:
    username: ${APP_METRICS_USERNAME:prometheus}
    password: ${APP_METRICS_PASSWORD:}
  security:
    bootstrap-admin-email: ${APP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${APP_ADMIN_PASSWORD:}
    bootstrap-responsible-name: ${APP_DEMO_RESPONSIBLE_NAME:}
    bootstrap-responsible-email: ${APP_DEMO_RESPONSIBLE_EMAIL:}
    bootstrap-responsible-position: ${APP_DEMO_RESPONSIBLE_POSITION:}
    bootstrap-responsible-password: ${APP_DEMO_RESPONSIBLE_PASSWORD:}
